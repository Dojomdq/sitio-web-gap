<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101010"><title>Evento GAP — Mar del Plata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--orange:#ff680a;--bg:#101010;--ink:#f6f3ee;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}.top{height:86px;border-bottom:1px solid #ffffff30;display:flex;align-items:center;justify-content:space-between}.brand{display:block;width:108px;line-height:0}.brand img{display:block;width:100%;height:auto}.back{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#bbb}.back:hover{color:var(--orange)}.detail{padding:50px 0 100px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:38px;align-items:start}.hero-img{min-height:460px;position:relative;background:linear-gradient(135deg,#252525,#101010);overflow:hidden}.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:18px;top:18px;background:var(--orange);color:#111;padding:9px 12px;font-size:10px;letter-spacing:.16em;font-weight:700;text-transform:uppercase}.kicker{color:var(--orange);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:10px}.info h1{font:italic 900 clamp(56px,7vw,96px)/.88 'Barlow Condensed',Impact,sans-serif;margin:0 0 14px;overflow-wrap:anywhere}.artist{font-size:19px;color:#ddd;margin:0 0 22px}.description{color:#c7c7c7;line-height:1.8;white-space:pre-wrap}.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;border-top:1px solid #ffffff30;border-bottom:1px solid #ffffff30;padding:22px 0;margin:28px 0}.facts div{display:grid;gap:6px}.facts small{color:#999;font-size:10px;letter-spacing:.15em}.facts strong{font-size:13px;line-height:1.5}.ticket{display:inline-flex;align-items:center;gap:20px;background:var(--orange);color:#101010;padding:17px 22px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.ticket:hover{background:#ff7c2c}.ticket[aria-disabled=true]{background:#333;color:#aaa;pointer-events:none}.notice{display:block;color:#aaa;font-size:12px;margin-top:12px}.gallery{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.gallery img{width:100%;height:240px;object-fit:cover;display:block}.error{padding:100px 0;text-align:center}.error h1{font:italic 900 76px/.9 'Barlow Condensed',Impact,sans-serif;overflow-wrap:anywhere}.error p{color:#aaa;line-height:1.7;margin:18px auto 28px;max-width:480px}.error a{color:var(--orange);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700}.footer{border-top:1px solid #ffffff25;padding:24px 0 36px;color:#888;font-size:11px;display:flex;justify-content:space-between}@media(max-width:780px){.detail{grid-template-columns:1fr;gap:26px;padding-top:28px}.hero-img{min-height:350px}.gallery{grid-column:auto;grid-template-columns:repeat(2,minmax(0,1fr))}.gallery img{height:180px}}@media(max-width:520px){.top{height:74px}.detail{padding-bottom:70px}.hero-img{min-height:275px}.facts{grid-template-columns:1fr 1fr;gap:18px 10px}.gallery{grid-template-columns:1fr 1fr}.gallery img{height:140px}.error h1{font-size:clamp(42px,16vw,62px)}.footer{display:block}.footer span{display:block;margin-top:8px}}
  </style>
</head>
<body>
  <nav class="top wrap"><a class="brand" href="/" aria-label="GAP, inicio"><img src="/assets/gap-logo.png" alt="GAP"></a><a class="back" href="/agenda">← TODA LA AGENDA</a></nav>
  <main id="event-detail" class="wrap"><p class="error">Cargando evento…</p></main>
  <footer class="footer wrap"><span>GAP · MAR DEL PLATA</span><span>Av. Constitución 5780</span></footer>
  <script type="module" src="/evento-page.js"></script>
</body>
</html>

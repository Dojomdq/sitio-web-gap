<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101010"><title>Agenda GAP — Próximos eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--orange:#ff680a;--bg:#101010;--ink:#f6f3ee;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}.top{height:86px;border-bottom:1px solid #ffffff30;display:flex;align-items:center;justify-content:space-between}.brand{display:block;width:108px;line-height:0}.brand img{display:block;width:100%;height:auto}.back{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#bbb}.back:hover{color:var(--orange)}header{padding:76px 0 38px}.kicker{color:var(--orange);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:12px}h1{font:italic 900 clamp(62px,10vw,120px)/.88 'Barlow Condensed',Impact,sans-serif;margin:0}header p{max-width:560px;color:var(--muted);line-height:1.7;margin-top:20px}.event-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:20px 0 100px}.event{min-height:380px;display:flex;flex-direction:column;background:#171717;border:1px solid #ffffff25;transition:transform .25s,border-color .25s}.event:hover{transform:translateY(-4px);border-color:var(--orange)}.event-img{height:225px;background:linear-gradient(135deg,#262626,#121212);overflow:hidden}.event-img img{width:100%;height:100%;object-fit:cover;display:block}.event-info{padding:20px;display:grid;gap:10px}.event-info small{font-size:10px;color:var(--orange);letter-spacing:.15em;text-transform:uppercase}.event-info h2{font:italic 800 36px/.95 'Barlow Condensed',Impact,sans-serif;margin:0}.event-info p{font-size:14px;color:#bbb;line-height:1.55;margin:0}.date{font-size:12px;color:#eee}.empty,.error{grid-column:1/-1;color:#aaa;line-height:1.7;padding:30px 0}.footer{border-top:1px solid #ffffff25;padding:24px 0 36px;color:#888;font-size:11px;display:flex;justify-content:space-between}@media(max-width:760px){.event-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{height:74px}}@media(max-width:520px){.event-grid{grid-template-columns:1fr}.event-img{height:240px}header{padding-top:55px}.footer{display:block}.footer span{display:block;margin-top:8px}}
  </style>
</head>
<body>
  <nav class="top wrap"><a class="brand" href="/" aria-label="GAP, inicio"><img src="/assets/gap-logo.png" alt="GAP"></a><a class="back" href="/#agenda">← VOLVER A GAP</a></nav>
  <header class="wrap"><div class="kicker">Agenda GAP</div><h1>PRÓXIMOS<br>EVENTOS.</h1><p>Shows, música y experiencias para encontrarnos frente al escenario.</p></header>
  <main class="wrap"><div id="event-grid" class="event-grid" aria-live="polite"><p class="empty">Cargando fechas…</p></div></main>
  <footer class="footer wrap"><span>GAP · MAR DEL PLATA</span><span>Fechas y horarios en hora local de Argentina.</span></footer>
  <script type="module" src="/agenda-page.js"></script>
</body>
</html>

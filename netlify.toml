[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/evento/:slug"
  to = "/evento.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/agenda"
  to = "/agenda.html"
  status = 200
  force = true

[[redirects]]
  from = "/chino"
  to = "/chino.html"
  status = 200
  force = true
